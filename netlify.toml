"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Netlify detects Next.js and runs it with the OpenNext adapter.
# Do not pin @netlify/plugin-nextjs; Netlify updates that runtime per build.
[build]
command = "npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "22"

# After both hostnames are attached in Netlify, send www to the apex domain.
[[redirects]]
from = "https://www.edumongolia.com/*"
to = "https://edumongolia.com/:splat"
status = 301
force = true
